apiVersion: apps/v1

kind: Deployment

metadata:
  name: tictactoe-dev

spec:
  replicas: 1
  selector:
    matchLabels:
      app: tictactoe-dev

  template:
      metadata:
        labels:
          app: tictactoe-dev
      spec:
        containers:
          - name: tictactoe-dev
            image: thejohnbaba/tictactoe-dev:latest
            imagePullPolicy: Always
            ports:
              - containerPort: 80


